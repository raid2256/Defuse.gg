<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEFUSE.GG — CS2 Stat Lookup</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <div class="logo">
        <span class="logo-brand">DEFUSE</span><span class="logo-dot">.GG</span>
      </div>
      <span class="badge">KEYLESS LOOKUP</span>
    </div>
  </header>

  <main class="container">

    <section class="hero">
      <h1>LOOKUP ANY CS2 PLAYER</h1>
      <p>Enter any 17-digit SteamID64 to inspect public kills, K/D ratio, headshot %, and HLTV rating.</p>
      
      <div class="search-box">
        <input type="text" id="steamInput" placeholder="Enter SteamID64 (e.g. 76561197960287930)" onkeypress="handleKeyPress(event)">
        <button class="btn-search" onclick="fetchPlayerStats()">Inspect Player</button>
      </div>
      <div id="errorMessage" class="error-banner" style="display: none;"></div>
    </section>

    <section id="dashboard" class="dashboard-grid" style="display: none;">
      
      <div class="profile-card">
        <img id="playerAvatar" src="" alt="Player Avatar" class="player-avatar">
        <div class="player-info">
          <h2 id="playerName">Player Name</h2>
          <p id="steamIdDisplay" class="steam-id">SteamID: -</p>
          <a id="profileLink" href="#" target="_blank" class="link-external">View Steam Profile ↗</a>
        </div>
      </div>

      <div class="metrics-grid">
        <div class="metric-card">
          <span class="metric-label">K/D RATIO</span>
          <span class="metric-value" id="kdRatio">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">HEADSHOT %</span>
          <span class="metric-value highlight" id="hsPercent">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">TOTAL KILLS</span>
          <span class="metric-value" id="totalKills">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">WIN RATE</span>
          <span class="metric-value" id="winRate">-</span>
        </div>
        <div class="metric-card">
          <span class="metric-label">HLTV RATING</span>
          <span class="metric-value" id="hltvRating">-</span>
        </div>
      </div>

    </section>

  </main>

  <footer>
    <p>DEFUSE.GG &copy; 2026 | Public Index Lookup</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
